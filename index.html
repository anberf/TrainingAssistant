<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Kettlebell TV Timer</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app" data-screen="picker" data-theme="idle">
    <section id="screen-picker" class="screen">
      <h1 id="app-title">Kettlebell TV Timer</h1>
      <p id="app-status">No routine loaded</p>
      <ul id="routine-list"></ul>
    </section>

    <section id="screen-run" class="screen" hidden>
      <div id="run-main">
        <div id="run-meta">
          <span id="run-badge"></span>
          <span id="run-block"></span>
          <span id="run-index"></span>
        </div>
        <h2 id="run-title"></h2>
        <div id="run-clock">
          <span id="run-countdown"></span>
          <span id="run-target"></span>
        </div>
        <p id="run-focus"></p>
        <ul id="run-cues"></ul>
        <p id="run-next"></p>
      </div>
      <div id="paused-overlay" hidden>PAUSED</div>
      <nav id="controls">
        <button id="btn-back" type="button" aria-label="Back"><span aria-hidden="true">◀</span> Back</button>
        <button id="btn-toggle" type="button" aria-label="Pause or resume"><span aria-hidden="true">⏯</span> <span id="btn-toggle-label">Pause</span></button>
        <button id="btn-skip" type="button" aria-label="Skip">Skip <span aria-hidden="true">▶</span></button>
      </nav>
    </section>

    <section id="screen-done" class="screen" hidden>
      <h2 id="done-title">Done</h2>
      <p id="done-elapsed"></p>
      <button id="btn-home" type="button">Back to routines</button>
    </section>
  </main>
  <script src="js/app-info.js"></script>
  <script src="js/routine.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/view.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
