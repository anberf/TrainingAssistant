<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Training Assistant</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app" data-screen="picker" data-theme="idle">
    <section id="screen-picker" class="screen">
      <h1 id="app-title">Training Assistant</h1>
      <p id="app-status">No routine loaded</p>
      <div id="pace-panel">
        <h2 id="pace-title">Pace</h2>
        <div id="pace-global" class="pace-row">
          <span class="pace-label">Seconds per rep</span>
          <button id="pace-global-minus" type="button" aria-label="Decrease seconds per rep">−</button>
          <span id="pace-global-value" class="pace-value"></span>
          <button id="pace-global-plus" type="button" aria-label="Increase seconds per rep">+</button>
        </div>
        <div id="pace-exercises"></div>
        <button id="pace-reset" type="button">Reset</button>
      </div>
      <ul id="routine-list"></ul>
      <p id="app-version"></p>
      <button id="owner-btn" type="button">Owner</button>
      <div id="owner-panel" hidden>
        <input id="owner-pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Owner PIN">
        <button id="owner-unlock" type="button">Unlock</button>
        <button id="owner-cancel" type="button">Cancel</button>
        <p id="owner-msg"></p>
      </div>
      <button id="import-btn" type="button" hidden>Import routine</button>
      <div id="import-panel" hidden>
        <label class="import-label" for="import-name">Name (required)</label>
        <input id="import-name" type="text" maxlength="60" autocomplete="off">
        <label class="import-label" for="import-weight">Weight (optional)</label>
        <input id="import-weight" type="text" maxlength="20" autocomplete="off">
        <label class="import-label" for="import-text">Table (Markdown or tab-separated)</label>
        <textarea id="import-text" rows="10" spellcheck="false"></textarea>
        <div class="import-actions">
          <button id="import-copy" type="button">Copy prompt for Claude Chat</button>
          <button id="import-check" type="button">Check</button>
          <button id="import-add" type="button" disabled>Add</button>
          <button id="import-cancel" type="button">Cancel</button>
        </div>
        <textarea id="import-prompt" rows="6" readonly hidden aria-label="Prompt for Claude Chat"></textarea>
        <p id="import-msg"></p>
        <div id="import-result"></div>
      </div>
    </section>

    <section id="screen-run" class="screen" hidden>
      <div id="run-main">
        <div id="run-meta">
          <span id="run-badge"></span>
          <span id="run-block"></span>
          <span id="run-index"></span>
        </div>
        <h2 id="run-title"></h2>
        <div id="run-clock">
          <span id="run-countdown"></span>
          <span id="run-target"></span>
          <img id="run-img" alt="" hidden>
          <video id="run-clip" muted loop playsinline hidden></video>
        </div>
        <p id="run-focus"></p>
        <ul id="run-cues"></ul>
        <p id="run-next"></p>
      </div>
      <div id="paused-overlay" hidden>PAUSED</div>
      <nav id="controls">
        <button id="btn-back" type="button" aria-label="Back"><span aria-hidden="true">◀</span> Back</button>
        <button id="btn-toggle" type="button" aria-label="Pause or resume"><span aria-hidden="true">⏯</span> <span id="btn-toggle-label">Pause</span></button>
        <button id="btn-skip" type="button" aria-label="Skip">Skip <span aria-hidden="true">▶</span></button>
      </nav>
    </section>

    <section id="screen-done" class="screen" hidden>
      <h2 id="done-title">Done</h2>
      <p id="done-elapsed"></p>
      <button id="btn-home" type="button">Back to routines</button>
    </section>
  </main>
  <script src="js/app-info.js"></script>
  <script src="js/routine.js"></script>
  <script src="js/pace.js"></script>
  <script src="js/owner.js"></script>
  <script src="js/owner-config.js"></script>
  <script src="js/drafts.js"></script>
  <script src="js/import.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/view.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/screen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
